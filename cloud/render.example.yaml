{
  "previews": { "generation": "off" },
  "services": [
    {
      "type": "web",
      "name": "ninai-cloud-example",
      "runtime": "docker",
      "repo": "https://github.com/HariDarshan2321/ninai",
      "branch": "main",
      "dockerfilePath": "./cloud/Dockerfile",
      "dockerContext": "./cloud",
      "region": "frankfurt",
      "plan": "0.5c-512mb",
      "numInstances": 1,
      "autoDeployTrigger": "checksPass",
      "healthCheckPath": "/ready",
      "envVars": [
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "ninai-cloud-example-db",
            "property": "connectionString"
          }
        },
        { "key": "HOST", "value": "0.0.0.0" },
        { "key": "PORT", "value": "10000" },
        { "key": "NINAI_DATABASE_POOL_MIN_SIZE", "value": "1" },
        { "key": "NINAI_DATABASE_POOL_MAX_SIZE", "value": "10" },
        { "key": "NINAI_AUTH_MODE", "value": "oauth" },
        { "key": "NINAI_OAUTH_ALLOW_PAT", "value": "false" },
        { "key": "NINAI_OAUTH_ISSUER", "sync": false },
        { "key": "NINAI_OAUTH_AUDIENCE", "sync": false },
        { "key": "NINAI_OAUTH_JWKS_URI", "sync": false },
        { "key": "NINAI_OAUTH_AUTHORIZATION_ENDPOINT", "sync": false },
        { "key": "NINAI_OAUTH_TOKEN_ENDPOINT", "sync": false },
        { "key": "NINAI_PUBLIC_RESOURCE_URL", "sync": false },
        { "key": "NINAI_OAUTH_CONTROL_CLIENT_ID", "sync": false },
        { "key": "NINAI_CONTROL_BASE_URL", "sync": false }
      ]
    }
  ],
  "databases": [
    {
      "name": "ninai-cloud-example-db",
      "databaseName": "ninai",
      "user": "ninai",
      "region": "frankfurt",
      "plan": "0.1c-256mb",
      "diskSizeGB": 15,
      "postgresMajorVersion": "16",
      "ipAllowList": []
    }
  ]
}
