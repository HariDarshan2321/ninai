[project]
name = "ninai-cloud"
version = "0.1.0"
description = "Opt-in hosted PostgreSQL service for Ninai"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninai_cloud"]
