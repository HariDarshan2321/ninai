[project]
name = "ninai-cloud"
version = "0.1.0"
description = "Opt-in hosted PostgreSQL service for Ninai"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.12.0,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
]

[project.scripts]
ninai-cloud-mcp = "ninai_cloud.mcp_server:main"
ninai-cloud-bootstrap = "ninai_cloud.bootstrap:main"
ninai-cloud-reviewer-seed = "ninai_cloud.reviewer_seed:main"

[project.optional-dependencies]
test = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninai_cloud"]
