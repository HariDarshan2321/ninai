[project]
name = "ninai-memory"
version = "0.1.0"
description = "Local-first, permissioned memory MCP server for AI tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ninai" }]
dependencies = [
  "mcp[cli]>=1.12.0",
]

[project.scripts]
ninai = "ninai.cli:main"
ninai-mcp = "ninai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninai"]
