[project]
name = "ninai-memory"
version = "0.1.0"
description = "Local-first, permissioned memory MCP server for AI tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ninai" }]
dependencies = [
  "mcp[cli]>=1.12.0",
]

[project.optional-dependencies]
# Desktop control-panel app (native window via the system WebView).
desktop = [
  "pywebview>=5.0",
]

[project.scripts]
ninai = "ninai.cli:main"
ninai-mcp = "ninai.server:main"
ninai-app = "ninai.desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninai"]
# Web assets under src/ninai/desktop/web are inside the package and ship
# automatically; no force-include needed.
