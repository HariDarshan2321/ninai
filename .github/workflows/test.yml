name: Validate project

on:
  push:
    paths:
      - "engine/**"
      - "cloud/**"
      - ".claude/**"
      - "website/**"
      - "scripts/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "engine/**"
      - "cloud/**"
      - ".claude/**"
      - "website/**"
      - "scripts/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: python ../scripts/verify_local_setup.py

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - run: python3 ../scripts/validate_website.py

  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ninai_test
          POSTGRES_USER: ninai_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninai_test -d ninai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NINAI_TEST_DATABASE_URL: postgresql://ninai_test:disposable_ci_only@127.0.0.1:5432/ninai_test
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m unittest discover -s tests -v
